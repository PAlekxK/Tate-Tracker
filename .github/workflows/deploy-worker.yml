name: Deploy Worker

# Auto-deploy Garden Guru's Worker on push to main — the CI-does-the-deploy path
# so a change to worker.js OR any digest source JSON reaches the live Worker
# without a manual `wrangler deploy`. Mirrors tools/deploy-worker.sh:
# rebuild digest -> deploy -> health-check, then commit the rebuilt digest back
# so the repo stays in sync with what's deployed.
#
# ✅ SETUP DONE 2026-08-13 — the repo secret is FERNWOOD_AUG_2026 [paul-chosen].
# The Cloudflare token behind it: "fernwood-worker-deploy (GitHub Actions)", built
# from the "Edit Cloudflare Workers" template, scoped to Paul's account only, with
# the template's zone-scoped Workers Routes permission REMOVED — this Worker serves
# from tate-tracker.paul-kirschenbauer.workers.dev, a workers.dev subdomain with no
# custom zone, so that permission would have forced a zone grant the deploy never uses.
# Add it back only if Fernwood moves to a custom domain.
#
# ⚠️ THE SECRET NAME IS LOAD-BEARING AND ITS FAILURE IS SILENT. The guard below is
# `if: env.CF_TOKEN != ''`, so a secret under any OTHER name means this workflow runs
# GREEN and simply skips the deploy — a passing check and nothing deployed. That is
# not hypothetical: on 2026-08-13 the secret was first added as CLOUDFLARE_API_TOKEN's
# name-mismatch twin and would have done exactly this. It is the same shape as the
# 2026-08-08 record-weather.yml break, which failed every 6 hours for four days while
# the dashboard stayed green (see CLAUDE.md) — a break in CI is invisible from the
# front end. If a deploy seems not to land, CHECK THIS NAME FIRST.
#   Rename procedure (GitHub cannot rename a secret): add the new name with the same
#   value, change BOTH `secrets.` references below, delete the old one, then prove it
#   with a workflow_dispatch run — not by reading the settings page.

on:
  push:
    branches: [main]
    paths:
      - "worker/worker.js"
      - "worker/wrangler.toml"
      - "tools/build-digest.py"
      # Digest source JSONs — a change here must rebuild + redeploy the digest
      - "plants.json"
      - "birds.json"
      - "mammals.json"
      - "amphibians.json"
      - "snakes.json"
      - "lizards.json"
      - "fishing.json"
      - "property.json"
      - "vehicles.json"
      - ".github/workflows/deploy-worker.yml"
  # Manual runs from the Actions tab (redeploy on demand)
  workflow_dispatch:

# Serialize deploys so two quick pushes can't race the deploy or the digest
# commit-back. Don't cancel an in-flight deploy midway.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the rebuilt digest back in sync

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.FERNWOOD_AUG_2026 }}
      WORKER_URL: https://tate-tracker.paul-kirschenbauer.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Rebuild the digest from the source JSONs (stdlib-only). Runs regardless
      # of the secret so a bad build fails loudly; the result is only deployed /
      # committed when the token is present.
      - name: Rebuild Garden Guru digest
        run: python3 tools/build-digest.py

      - name: Verify digest matches a fresh rebuild
        run: python3 tools/check-digest-fresh.py

      # This step firing at all means the deploy did NOT happen. It is the only
      # visible trace of a silent skip, so it names the exact secret rather than
      # saying "the token" — a generic message is what makes a name mismatch hard
      # to spot in a green run.
      - name: Skip notice (secret FERNWOOD_AUG_2026 not visible)
        if: env.CF_TOKEN == ''
        run: |
          echo "::warning::NO DEPLOY. Repo secret FERNWOOD_AUG_2026 is empty or absent, so the deploy and health check were skipped. This run is green and deployed NOTHING. Check the secret's exact name in Settings -> Secrets and variables -> Actions."

      - name: Deploy Worker (wrangler)
        if: env.CF_TOKEN != ''
        working-directory: worker
        env:
          # The ENV VAR name is fixed by wrangler — it reads CLOUDFLARE_API_TOKEN and
          # nothing else, so do NOT rename the left side to match the secret. Only the
          # right side (which secret supplies the value) is ours to choose.
          CLOUDFLARE_API_TOKEN: ${{ secrets.FERNWOOD_AUG_2026 }}
        run: npx --yes wrangler@4 deploy

      - name: Health check
        if: env.CF_TOKEN != ''
        run: |
          echo "Checking $WORKER_URL/health …"
          curl -fsS "$WORKER_URL/health" | python3 -m json.tool || echo "(couldn't fetch/parse /health — check manually)"

      # Keep the committed digest in sync with what was just deployed. [skip ci]
      # in the message prevents this push from re-triggering the workflow.
      - name: Commit rebuilt digest if changed
        if: env.CF_TOKEN != ''
        run: |
          if [[ -n $(git status --porcelain worker/digest.json) ]]; then
            git config user.name "fernwood-deployer[bot]"
            git config user.email "fernwood-deployer@users.noreply.github.com"
            git add worker/digest.json
            git commit -m "digest: rebuild on deploy $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "worker/digest.json already in sync."
          fi
