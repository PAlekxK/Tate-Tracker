name: Deploy QA

# The QA leg of C4 (2026-09-03, .plans/2026-09-03-c4-environments-PLAN.md § 3e).
# On push to `staging`, TWO things happen, and neither touches production:
#   1. the QA Worker (`tate-tracker-qa`, its own KV namespace) is redeployed, and
#      its /health is ASSERTED — env "qa", kv_canary "qa" — not merely printed;
#   2. the commit's bytes are uploaded to the Cloudflare Pages project
#      `fernwood-qa` (served at https://fernwood-qa.pages.dev/), from a
#      `git archive` export so only TRACKED files ever leave the runner — never
#      the working tree (locally, `.private/` sits beside it).
# No digest commit-back: that stays on `main` (deploy-worker.yml). The weather
# bots stay `main`-only — a declared exception, not an oversight.
#
# ⚠️ Same secret, same silent-skip hazard as deploy-worker.yml: the guard below is
# `if: env.CF_TOKEN != ''`, so a secret under any OTHER name means this workflow
# runs GREEN and deploys NOTHING. The skip-notice step is the only visible trace.
# The token behind FERNWOOD_AUG_2026 was built from the "Edit Cloudflare Workers"
# template; the Pages upload additionally needs the account permission
# "Cloudflare Pages: Edit". Until that is granted, the Pages job FAILS LOUD (403)
# rather than pretending — a red Pages job with a green Worker job is that state.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-qa
  cancel-in-progress: false

permissions:
  contents: read

env:
  QA_WORKER_URL: https://fernwood-qa.paul-kirschenbauer.workers.dev
  QA_PAGES_URL: https://fernwood-qa.pages.dev/
  PAGES_PROJECT: fernwood-qa

jobs:
  worker-qa:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.FERNWOOD_AUG_2026 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild Garden Guru digest (deployed with the Worker; never committed back here)
        run: python3 tools/build-digest.py

      - name: Skip notice (secret FERNWOOD_AUG_2026 not visible)
        if: env.CF_TOKEN == ''
        run: |
          echo "::warning::NO DEPLOY. Repo secret FERNWOOD_AUG_2026 is empty or absent, so the QA Worker deploy was skipped. This run is green and deployed NOTHING."

      - name: Guru replay — six fence parsers lifted from the built viewer resolve against canon; dispatch fixtures (5a/5b; no network)
        run: node tools/guru-replay.mjs
      - name: Library index manifest matches its sources (6a; rebuilds in memory, no KV)
        run: python3 tools/build-library-index.py --check
      - name: Deploy QA Worker (wrangler --env qa)
        if: env.CF_TOKEN != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.FERNWOOD_AUG_2026 }}
        run: npx --yes wrangler@4 deploy --env qa

      # Assert, don't print. A /health that answers anything but qa/qa means the
      # deploy bound the wrong namespace or the wrong environment — the exact
      # failure the canary exists to catch — and the job must go red.
      - name: Assert QA /health (env qa, kv_canary qa)
        if: env.CF_TOKEN != ''
        run: |
          body=$(curl -fsS "$QA_WORKER_URL/health")
          echo "$body" | python3 -m json.tool
          echo "$body" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          bad = [k for k, v in (("env", d.get("env")), ("kv_canary", d.get("kv_canary"))) if v != "qa"]
          if bad:
              print("::error::QA /health is not qa/qa:", {k: d.get(k) for k in ("env", "kv_canary")}); sys.exit(1)
          if d.get("configured", {}).get("github"):
              print("::error::QA Worker has GITHUB_* configured — promote-species must be unexercisable in QA"); sys.exit(1)
          print("QA /health asserted: env=qa kv_canary=qa github=false")'

  # ⛔⛔ THE `pages-qa` JOB WAS REMOVED 2026-09-08. QA HAD TWO BUILD PATHS AND THEY DISAGREED.
  #
  # This job uploaded a bare `git archive HEAD` to the SAME Pages project and the SAME branch that
  # `tools/pages-deploy.py --env qa` writes — so the origin was whichever ran last.
  #
  # ⭐ THEY DO NOT PRODUCE THE SAME BYTES, and it is not close. `measured` 2026-09-08:
  #   · this job's export — the tracked tree — `viewer.html` 2,216,135 bytes, 12 road-name hits
  #   · pages-deploy's export — 1,203,913 bytes, built from `instance/qa.json`, pruned to
  #     HOUSEHOLD_ALLOW, with 914 removed paths TOMBSTONED
  # So every push to `staging` replaced the neutral build with Fernwood's own and UN-TOMBSTONED
  # every pruned path. The two also falsified each other's checks: the `check-live` step below
  # REQUIRED the un-pruned build, and `check-estate-neutral` requires the pruned one.
  #
  # ⚠️ IT IS DRIFT, NOT A BUG. This workflow is dated 2026-09-03. QA joined pages-deploy's
  # HOUSEHOLD_ALLOW set on 2026-09-07 `[paul-ruled]` — the fix for the class where "the environment
  # whose entire job is to be a MIRROR of production was the one environment built by a different
  # code path." That change landed in the tool and never landed here, and nothing compared them.
  #
  # ⭐ ONE WRITER NOW: `python3 tools/pages-deploy.py --env qa`. It is the only path that prunes,
  # tombstones, builds from the instance, runs the neutrality falsifier, LOADS THE BUILD HEADLESS
  # before shipping, and calls post-deploy afterwards. CI could not do those without carrying
  # Playwright and the whole tool chain, and a second writer that does LESS is what caused this.
  # The loop already points at that command: `qa-behind.py` and the post-commit hook both print it.
  #
  # ⚠️ WHAT THIS COSTS, stated: a push to `staging` no longer updates the QA ORIGIN — only the QA
  # WORKER, below, which is what this workflow is named for. Deploying QA is now a deliberate act.
  # That is the direction the release loop already runs in: gate ① is evidence AT A SHA, and an
  # origin that moves on its own under a walk is what expires that evidence.
