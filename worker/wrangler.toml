# C4 4c (2026-09-03): the Worker's name is now `fernwood` (→ fernwood / fernwood-qa).
# The OLD scripts `tate-tracker` / `tate-tracker-qa` stay deployed and ALIVE — same KV
# namespace ids below, so the data is shared, not copied — until the viewer, the tools,
# the recorder and both workflows point at the new name AND 7 days of /api/metrics on
# the old script show zero traffic. Only then: `npx wrangler delete --name tate-tracker`.
name = "fernwood"
main = "worker.js"
compatibility_date = "2026-05-01"

# Replace the id below with the KV namespace id printed by:
#   wrangler kv namespace create OBSERVATIONS
[[kv_namespaces]]
binding = "OBSERVATIONS"
id = "100f2b95e4be4c088a0000f917cf987b"

# SHARED_TOKEN is set via:
#   wrangler secret put SHARED_TOKEN
# (do NOT commit the actual token here — it's read from Worker secrets at runtime)

# ── Environments (C4 step 3a, 2026-09-03) ─────────────────────────────────────
# ENV_NAME is read by /health (`env`) and stamped on every new feedback / zone-audio
# record (`env`), so a reader can tell a QA write from Mom's. The KV canary is the
# second proof: `/health.kv_canary` is READ FROM THE BOUND NAMESPACE, never re-typed.
[vars]
ENV_NAME = "production"
# C5 6a/6b (2026-09-03): every KV key is `<ESTATE_ID>:<kind>:<suffix>`; dates before
# LEGACY_BEFORE read the unprefixed keys written before the cutover. Both are
# per-environment and NON-INHERITABLE — a forgotten one makes the Worker throw.
# Prod cuts over at 2026-09-04 00:00Z (the next UTC day after deploy, so no day is
# split across two keys); QA cut over a day earlier to prove the path.
ESTATE_ID = "est-3c9f1a"
LEGACY_BEFORE = "2026-09-04"
# C5 7c: the Ambient Weather station this estate reads — instance data, not engine code.
# AMBIENT_MAC — a Worker SECRET since 2026-09-04 (paul-stated: "go for it now"), never a var in this public file; install with `wrangler secret bulk` per env. The route answers 503 without it.
# C6 3c: hostnames a presented grant may arrive from (the Origin header). Only already-public hosts here; a
# family's own hostname is set as a var from the private sibling at deploy, never in this tracked file.
FAMILY_HOSTS = "palekxk.github.io"

# QA: its own KV namespace (nothing here can reach `feedback:<date>` in prod), its
# own SHARED_TOKEN, no GITHUB_* / OPENAI_* (promote-species → 503 by design).
# Deploy: `npx wrangler deploy --env qa`  ·  Remove: `npx wrangler delete --env qa`
[env.qa]
[env.qa.vars]
ENV_NAME = "qa"
# Privacy seat 2026-09-03 (finding 2): QA carries its OWN estate id, so a QA credential is never shaped like
# a prod one and 3b's two-estate check can run. QA holds only probe rows; today's prefixed QA rows are orphaned by design.
ESTATE_ID = "est-qa0001"
LEGACY_BEFORE = "2026-09-03"
# AMBIENT_MAC — secret per env (see [vars] note)
# Guru 3b: the QA Worker refuses /api/chat once today's spend, priced at the model's published rates, passes
# this many dollars (prod has NO ceiling). Paul, 2026-09-03: "a clean dollar fifty a day".
CHAT_DAILY_BUDGET_USD = "3.00"   # paul-stated 2026-09-04 ~3:20 AM ET: "raise the limit to three dollars and keep momentum going on building — as long as we are really taking all this seriously and doing the analysis" (was 1.50, paul-stated 2026-09-03)
FAMILY_HOSTS = "fernwood-qa.pages.dev"
[[env.qa.kv_namespaces]]
binding = "OBSERVATIONS"
id = "a0cf82b615c648ff972961c46ce42661"

# LAB (2026-09-04, paul-asked): Paul + Claude work ahead here. No real person is ever served
# from it. Its own KV namespace, its own estate id — nothing here can reach QA's rows or prod's.
# ⛔ NO GITHUB_TOKEN, deliberately and permanently: GITHUB_BRANCH defaults to "main" (worker.js
# ~1974), so a lab Worker holding one would promote species straight onto Mom's live branch.
# Deploy: `npx wrangler deploy --env lab`  ·  Remove: `npx wrangler delete --env lab`
# ⭐ FERNWOOD DEV `[paul-ruled 2026-09-05]`: "we should have a Fernwood dev, qa, and production."
# The estate is now est-3c9f1a — THE SAME COORDINATE AS PRODUCTION — because an estateId names an
# ESTATE, not an estate-in-an-environment, and estate.json already rules an id "a COORDINATE, not a
# label." The environment is the NAMESPACE; this one is 1e0bd883, prod's is 100f2b95, and they cannot
# see each other. Same property, same shape, different data — which is what environments are for.
#
# ⛔ AND THIS BREAKS G3. grant-mint's estate_agrees() stops a credential being minted into the wrong
# environment by comparing the estate you asked for against the estate that env binds. Once dev, qa
# and production all bind est-3c9f1a that comparison is always true and THE CHECK CAN NEVER FIRE —
# so a credential meant for dev, minted with the wrong --env, lands in PRODUCTION as a valid working
# credential for the real Fernwood, silently. The guard has to be rebuilt around which NAMESPACE is
# being written, not which estate was named. Demonstrated, not assumed — see the session record.
#
# ⚠️ The DEPLOYMENT is still named lab (URL, worker name, gate-2 link, tools). Renaming it to dev is
# separate churn and is not what makes this Fernwood dev; the estate is.
[env.lab]
[env.lab.vars]
ENV_NAME = "lab"
# ⛔ LAB MUST NOT SHARE PRODUCTION'S ESTATE ID. It was "est-3c9f1a" — byte-identical to prod's — and
# every KV key is `<estateId>:<kind>:<suffix>`, so the estate id is the ONLY tenant separator inside a
# namespace. With them equal, lab and prod records were told apart ONLY by living in different KV
# namespaces: one mispointed binding and lab's writes land in prod's store under keys nothing can
# distinguish, carrying no marker saying which environment wrote them. Restored to est-lab0001 (which
# already held records here) on 2026-09-05, while this was still a config change and not a forensic
# sort. `paul-approved`; pre-switch export in .private/kv-exports/lab-est-3c9f1a-preswitch.json.
ESTATE_ID = "est-lab0001"
# 1970 on purpose: a fresh estate has NO pre-cutover era, so no key may ever route to the
# unprefixed legacy reads. (LEGACY_BEFORE is non-inheritable and `legacyBefore()` THROWS
# without it — a new env that omits it is dead on its first dated read, not degraded.)
LEGACY_BEFORE = "1970-01-01"
# The ceiling now applies to every non-production env (worker.js, 2026-09-04); it read
# `ENV_NAME === "qa"` until today, so lab would have inherited prod's NO ceiling — in the one
# environment we hammer Guru hardest.
CHAT_DAILY_BUDGET_USD = "3.00"
FAMILY_HOSTS = "fernwood-lab.pages.dev"
# PBKDF2 at a real iteration count exceeds the default CPU ceiling and the isolate is KILLED — which
# surfaces as a 1101 that `try/catch` cannot catch, because the isolate is gone rather than throwing.
# Measured 2026-09-05: 2,000 iterations succeeds, 210,000 does not.
[env.lab.limits]
cpu_ms = 5000

[[env.lab.kv_namespaces]]
binding = "OBSERVATIONS"
id = "1e0bd883e9824388af66563775c96d56"

# HOME (2026-09-04) — the account-based deployment: a person logs in and keeps their places: the account-based app where a real person
# logs in and sets up their place. Mom is the first. ENV_NAME is "home", NOT "production" —
# `production` is a ROLE that transfers (content-steward, 2026-09-04), and the frozen Fernwood held it.
# ⭐ THE CONDITION THIS WAS WAITING ON HAS BEEN MET `[paul-stated 2026-09-05]`: the frozen GitHub-Pages
# Fernwood is now named **the legacy version**, which takes it OUT of the production role. So the word
# is free and this environment is Fernwood production — the rename is bookkeeping, not a decision, and
# it is deliberately not done in the same commit as the ruling.
# ⛔ NO GITHUB_TOKEN, ever: GITHUB_BRANCH defaults to "main", so a token here would promote
# species onto Mom's live branch.
# Deploy: `npx wrangler deploy --env home`
[env.home]
[env.home.vars]
ENV_NAME = "home"
ESTATE_ID = "est-e6696a"
# A fresh estate has no pre-cutover era, so no key may route to the unprefixed legacy reads.
LEGACY_BEFORE = "1970-01-01"
# Generous on purpose. It exists to stop a BUG, never to stop HER — the Guru cost analysis puts a
# cold turn at ~19¢ and the warm path at ~3¢, so her real usage cannot approach this. A brand-new
# environment with an unproven flow should not be the one deployment with no brake.
CHAT_DAILY_BUDGET_USD = "10.00"
FAMILY_HOSTS = "fernwood-home.pages.dev"
[[env.home.kv_namespaces]]
binding = "OBSERVATIONS"
id = "79464451e3a7497594b17d8c60c7254d"
