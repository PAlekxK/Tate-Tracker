<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Settings</title>
<!--
  settings/place/index.html — this HOME's settings. Its name and its colour, and nothing else yet.

  ⭐ IT IS PAINTED IN THE PLACE'S COLOUR `[paul-ruled 2026-09-06, VOCABULARY §3g]`: "if they're
  looking at a given estate, or estate settings, or other derivative pages, it's the colour they
  selected for that estate." A settings page reached from a home is inside that home.

  ⭐ ONE PARENT, SO "BACK" IS A WORD. This surface is reachable only from the estate page, and
  account settings only from the shelf — so the return control NAMES its destination and nothing is
  stored that could be wrong. The constraint that keeps that true lives on the shelf: a row there
  does one thing, enter the home.

  ⛔ NAME AND COLOUR ONLY, DELIBERATELY. ux-expert's cut list for pass 1, and it is Paul's stated
  minimum. Address editing is the closest call and is CUT: it is a round trip through validation
  the arrival page's note-box link covers honestly meanwhile. Ranking editing is cut. No disclosure
  of any kind — a settings page is the most tempting place in any app to build an accordion, and at
  this reader's measured depth an accordion is a page she has not read.

  ⭐ THE LOOP CLOSES ON THE RETURN TRIP, not with a receipt: she saves, taps back, and the masthead
  is already the colour she chose. That is the visible close this project's own doctrine asks for,
  and it costs no extra words.
-->
<style>
  :root { --ink:#23301f; --ink-soft:#5d6b57; --line:#d8eacc; --accent:#2f5d3a; --paper:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:0 0 56px;
    font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink); background:linear-gradient(#edf7e6,#e2f0d8); background-attachment:fixed;
    -webkit-text-size-adjust:100%; }
  .wrap { max-width:660px; margin:0 auto; padding:0 18px; }
  header { background:var(--accent); color:#fff; padding:18px 18px 20px; }
  header .inner { max-width:660px; margin:0 auto; }
  .utility { margin:0 0 10px; }
  .ubtn { color:#fff; opacity:.8; text-decoration:none; font-size:.82rem; position:relative; }
  .ubtn:hover, .ubtn:focus-visible { opacity:1; }
  .tap44::after { content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
                  width:44px; height:44px; min-width:100%; }
  h1 { margin:0; font-size:1.5rem; font-weight:600; }
  .card { background:var(--paper); border:1.5px solid var(--line); border-radius:18px; padding:20px 18px; margin:18px 0; }
  label { display:block; font-size:.82rem; letter-spacing:.02em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  input[type=text] { width:100%; font:inherit; padding:11px; border:1.5px solid #c6d6bb; border-radius:12px; }
  .quiet { font-size:.92rem; color:var(--ink-soft); margin-top:6px; }
  .swatches { display:flex; flex-wrap:wrap; gap:12px; margin-top:4px; }
  .swatch { background:none; border:0; padding:0; cursor:pointer; font:inherit; text-align:center; width:66px; }
  .swatch i { display:block; width:44px; height:44px; border-radius:50%; margin:0 auto;
              border:3px solid transparent; }
  .swatch span { display:block; font-size:.82rem; color:var(--ink-soft); margin-top:4px; }
  .swatch[aria-pressed="true"] i { border-color:var(--ink); }
  .swatch[aria-pressed="true"] span { font-weight:600; color:var(--ink); }
  /* ONE affirmative grammar: filled + ✓. These are the ratified components, not lookalikes. */
  button.save { font:inherit; cursor:pointer; border-radius:12px; padding:12px 18px; border:1.5px solid var(--accent);
                background:var(--accent); color:#fff; font-weight:600; }
  .tick { margin-right:7px; }
  .trouble { color:#8a3b2a; margin-top:10px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<header><div class="inner">
  <div class="utility"><a class="ubtn tap44" id="back" href="/estate/">‹ Back</a></div>
  <h1>Settings</h1>
</div></header>

<div class="wrap">
  <div class="card">
    <label for="nm">What you call this home</label>
    <input id="nm" type="text" maxlength="60" autocapitalize="words">
    <p class="quiet">However you say it is how it will read — nothing here gets tidied up.</p>
  </div>

  <div class="card">
    <label>Its colour</label>
    <div class="swatches" id="swatches"></div>
    <p class="quiet">This is the colour this home opens in. Your other homes keep their own.</p>
  </div>

  <!-- ⛔ A SIGNPOST, NOT A SECOND PARENT. The `strict` seat, reading its own walk: finding "how to
       reach you" again "meant leaving the home entirely and going two levels deep through a
       differently-named screen — not hidden, but filed under the wrong noun for where a cautious
       person would look first." That is a real cost for the reader most likely to want it back.
       ⭐ It is a LINE, not a control: naming where the thing lives keeps one parent per surface, so
       "back" stays a word rather than a stored origin. Moving contact preference here would be the
       wrong fix — it is true of the PERSON, not of this home, and would then be edited in two
       places. -->
  <p class="quiet">How I get in touch with you lives in <a href="/settings/account/">your account</a> —
     it is about you rather than about this home, so it is the same wherever you are.</p>

  <p><button type="button" class="save" id="save"><span class="tick">✓</span>Save</button></p>
  <p class="trouble" id="trouble" hidden></p>
</div>

<script>
(function () {
  "use strict";
  var label = (location.hostname.split(".")[0] || "");
  var WORKER = (/\.pages\.dev$/.test(location.hostname) && /^[a-z0-9-]{2,40}$/.test(label))
    ? "https://" + label + ".paul-kirschenbauer.workers.dev"
    : "https://fernwood.paul-kirschenbauer.workers.dev";

  var K_GRANT = "fw-grant", K_NAME = "fw-onboard-name", K_COLOR = "fw-accent", K_USER = "fw-username";
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function el(id) { return document.getElementById(id); }

  // ⚠️ CANONICAL LIST IS engine/palette.json — `tools/palette.py --check` recomputes every contrast
  // ratio from the hex and fails below AAA. This is a copy because these pages have no build step;
  // if they diverge, palette.json wins. Same arrangement, and same warning, as onboarding.
  var PALETTE = [
    { id:"stone", name:"Stone", hex:"#3F5266" }, { id:"pine", name:"Pine", hex:"#2F5D3A" },
    { id:"lake", name:"Lake", hex:"#2C5674" }, { id:"clay", name:"Clay", hex:"#7A3E2A" },
    { id:"dusk", name:"Dusk", hex:"#6B4676" }, { id:"spruce", name:"Spruce", hex:"#245C5C" },
    { id:"fern", name:"Fern", hex:"#2C4A2C" }
  ];

  var grant = read(K_GRANT);
  var chosen = read(K_COLOR);

  // ⛔ OPEN SHOWING THE COLOUR THE MASTHEAD IS ACTUALLY RENDERING, never a declared-but-unread one.
  // user-researcher named this specifically: `fw-accent` is ambiguous evidence, and a settings page
  // that opens on a value the reader cannot see anywhere is a page that disagrees with her screen.
  if (chosen && /^#[0-9a-fA-F]{6}$/.test(chosen)) {
    document.documentElement.style.setProperty("--accent", chosen);
  }
  el("nm").value = read(K_NAME) || "";

  function paint() {
    var host = el("swatches");
    host.innerHTML = "";
    PALETTE.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "swatch";
      b.setAttribute("aria-pressed", String((chosen || "").toLowerCase() === c.hex.toLowerCase()));
      b.setAttribute("aria-label", c.name);
      var i = document.createElement("i"); i.style.background = c.hex;
      var s = document.createElement("span"); s.textContent = c.name;
      b.appendChild(i); b.appendChild(s);
      b.addEventListener("click", function () {
        chosen = c.hex;
        // Applied immediately, so the choice is visible on the screen making it rather than only
        // after a save — she can see what she is choosing before she commits to it.
        document.documentElement.style.setProperty("--accent", c.hex);
        paint();
      });
      host.appendChild(b);
    });
  }
  paint();

  el("save").addEventListener("click", function () {
    var nm = (el("nm").value || "").trim();
    var btn = el("save");
    btn.disabled = true; btn.innerHTML = "Saving…";
    var body = {};
    if (nm) body.name = nm;
    if (chosen) body.accent = chosen;
    var u = read(K_USER);
    if (u) body.username = u;
    var h = { "Content-Type": "application/json" };
    if (grant) h["X-Grant"] = grant;
    fetch(WORKER + "/api/profile", { method: "POST", headers: h, body: JSON.stringify(body) })
      .then(function (r) {
        if (!r.ok) throw new Error("not ok");
        // ⛔ LOCAL ONLY AFTER THE SERVER HAS IT. Writing the cache first would show her a change
        // that a failed save had not made — the same shape as telling someone a note was saved
        // when it was not, which this project has broken twice.
        if (nm) store(K_NAME, nm);
        if (chosen) store(K_COLOR, chosen);
        // ⭐ THE LOOP CLOSES ON THE RETURN TRIP: back to her home, already wearing the change.
        location.href = "/estate/";
      })["catch"](function () {
        btn.disabled = false; btn.innerHTML = '<span class="tick">✓</span>Save';
        el("trouble").textContent = "That didn't go through — your changes are still here, tap Save once more.";
        el("trouble").hidden = false;
      });
  });
})();
</script>
</body>
</html>
