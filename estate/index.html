<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>My Home</title>
<!--
  estate/index.html — WHERE THE HANDOFF LANDS. The first sight of a person's own place.

  ⛔ WHY THIS FILE EXISTS AT ALL. Until 2026-09-06 the handoff button pointed at `/viewer`, and a
  synthetic walker who had just typed one address landed in ANOTHER HOUSEHOLD'S PLACE — the
  Mountain Road, someone else's plants, someone else's vehicles. `viewer.html` is a BUILD ARTIFACT
  (engine template + the instance's own json + canon, inlined at build time), so every account on a
  deployment gets the same file. `[paul-stated 2026-09-06]`: "it should not take you to Fernwood at
  the very end. There needs to be an instance populated for the address that we just put in."

  ⛔⛔ AND IT IS DELIBERATELY **NOT** THE FERNWOOD VIEWER WITH CARDS HIDDEN. ux-expert ranked that
  above every other finding: card-hiding leaves the masthead suffix, the jump strip, Guru's digest,
  the ack ribbon, the release notes and the station — six surfaces that would each re-ship the
  tenancy leak. The falsifier is mechanical and lives in tools/check-estate-neutral.py: load this
  page and grep it for EVERY NEEDLE THE CHECKER DECLARES (it owns the list; do not inline one here,
  which is how this very comment used to ship four of them). Zero hits
  or it is not shipped.

  ⭐ THE GOVERNING SHAPE, arrived at independently by two seats and adopted:
      **Replaying raw input is a form. Replaying what we DID with it is a receipt.**
  So nothing here asks a question s4 already settled. The address was confirmed next to a map pin
  one screen ago; here it appears with its settled state, never with a second confirm pair. Only
  what s4 never asked may be asked here.

  ⛔ IT MUST READ CORRECTLY WITH ZERO TAPS. The playback is a statement she can leave alone; every
  control is available, never a gate. That is the test that keeps this from becoming a form — and
  it is what protects the reader whose measured behaviour is 0-for-35 on affordances that ask.

  ⛔ NO WEBFONT FETCH, same as onboarding. Loading a font contacts a third party before the reader
  has done anything, which would falsify the privacy posture the flow states two screens earlier.

  ⛔ COPY REACHING A PERSON IS AUTHORED CONTENT under the AI boundary. Drafted by content-steward,
  the three rulings below are Paul's, and he reads it before any link is sent.
    · "Early days", not "Buildout in progress" `[paul-ruled 2026-09-06]` — "in progress" is
      status-tracker vocabulary and asserts activity that is not happening; a reader returning in
      four days to an identical screen would have been told something false.
    · the banner states the MECHANISM, not the importance `[paul-ruled 2026-09-06]` — "helps make
      clear what happens with the feedback, not just saying it's important with no detail."
    · Mom is a COLD START, not a migration `[paul-ruled 2026-09-06]` — so she meets this screen
      too, and it is not built for one reader.
-->
<style>
  :root {
    --ink: #23301f; --ink-soft: #5d6b57; --accent: #3F5266;              /* A18: STONE cold default (matches onboarding:69); overwritten at runtime by the reader's own colour */
    --paper: #fff; --ground: #edf7e6;
    /* the ground and the hairline follow the chosen colour `[paul-ruled 2026-09-06]` — "a green background
       with a blue-grey header doesn't seem right" — chroma-clamped mixes toward white (ux-expert token set) */
    --wash-1: color-mix(in srgb, var(--accent) 7%, #fff); --wash-2: color-mix(in srgb, var(--accent) 13%, #fff);
    --line: color-mix(in srgb, var(--accent) 18%, #fff);
  }
  * { box-sizing: border-box; }
  body { padding-bottom:96px;   /* the feedback bubble floats over the last lines otherwise (mom seat, round 3) */
    margin: 0; padding: 0 0 56px;
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background:linear-gradient(var(--wash-1), var(--wash-2)); background-attachment: fixed;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 660px; margin: 0 auto; padding: 0 18px; }

  /* ── the masthead IS her colour. ux-expert: a value that has to be STATED has failed to be seen,
        so the chosen accent is never a playback row — it is the header. ─────────────────────── */
  header { background: var(--accent); color: #fff; padding: 22px 18px 18px; }
  header .inner { max-width: 660px; margin: 0 auto; }
  .utility { display: flex; justify-content: space-between; align-items: center; margin: 0 0 10px; }
  /* ⛔ .82rem AT .8 OPACITY WAS TOO QUIET TO FIND. The `mom` seat, reading her own walk: these are
     "small, quiet words on a dark header that I only found because I was hunting" — and she is the
     reader least likely to hunt. Paul asked for a single UNINTRUSIVE control and that still holds;
     unintrusive means it does not compete with her place's name, not that it hides. Raised to .95rem
     at full opacity with an underline, which is still a utility line above the h1 and is now legible
     at A+ on a dark ground. The 44px hit area was never the problem — being SEEN was. */
  /* the door is the one control that leaves the page: a filled button, not a header utility link — it
     rendered white-on-white inside the card and every seat missed it (round 2, 2026-09-06). */
  .door { margin:16px 0 0; padding-right:56px; }   /* room for the corner bubble beside the one button this page exists for (mom, round 9) */
  .door a.ubtn { display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none;
                 border-radius:12px; padding:13px 16px; font-weight:600; }
  .ubtn { color:#fff; opacity:1; text-decoration:underline; text-underline-offset:3px;
          font-size:.95rem; position:relative; }
  .ubtn:focus-visible { outline:3px solid #cfe6b8; outline-offset:2px; }
  /* 44px hit area without a 44px box — the shared pattern this repo already uses everywhere. */
  .tap44::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
                  width: 44px; height: 44px; min-width: 100%; }
  h1 { margin: 0; font-size: 1.5rem; line-height: 1.25; font-weight: 600; word-break: break-word; }
  /* ⚠️ WRAP, NEVER TRUNCATE. #pname promises 60 characters and the wide-eyed seat types 33 with a
     curly apostrophe; a masthead that ellipsises has edited her word. */
  /* ⛔ UTILITY, NOT IDENTITY. This sat at masthead weight directly under her place's name — the
     second most prominent thing on the screen was a username. It is here so a shared device can say
     whose place this is; it is not what she came to see. */
  .who { margin: 6px 0 0; font-size: .78rem; opacity: .62; font-weight: 400; }

  /* ── the banner: a STATE banner, not a feedback banner. Its content is what is happening to her
        place; the invitation to correct rides inside the rows, attached to specific things she
        gave — which is where the changeability rule says it belongs. ──────────────────────── */
  .banner {
    background: var(--wash-1); border-bottom: 1px solid var(--line);
    padding: 11px 18px; font-size: .95rem; color: var(--ink-soft);
  }
  .banner .inner { max-width: 660px; margin: 0 auto; }
  /* ⛔ A <p>, NOT A BARE DIV — and that is an instrument decision as much as a semantic one. The
     journey harness reads a screen by collecting h1,h2,h3,p,label,li,strong,em,span; text in a bare
     div is INVISIBLE to it. Caught on this page's first smoke test: the banner rendered for a human
     and did not exist for the walk, so no synthetic seat could ever have reported on it. A surface
     the instrument cannot see is a surface nobody reviews. */
  .banner .bannertext { margin: 0; }

  .card {
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 18px;
    padding: 20px 18px; margin: 18px 0;
  }
  .state { margin: 0 0 6px; font-size: 1.15rem; font-weight: 600; }
  .lede { margin: 0 0 4px; }
  .soft { color: var(--ink-soft); }
  .quiet { font-size: .92rem; color: var(--ink-soft); }

  .rows { margin: 4px 0 0; }
  .row { padding: 14px 0; border-top: 1px solid #eef4e8; }
  .row:first-child { border-top: 0; }
  .row .label { font-size: .82rem; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-soft); }
  .row .value { margin: 3px 0 0; white-space: pre-line; }   /* her lines, exactly as typed */
  .row .prov { margin: 4px 0 0; font-size: .88rem; color: var(--ink-soft); }
  .row .act { margin: 7px 0 0; }
  .row .act a { color: var(--accent); text-decoration: underline; font-size: .92rem; }

  /* ── ONE affirmative grammar (CLAUDE.md standing rule 1): filled + ✓ for the affirmative,
        outlined neutral for the secondary. These are those components, not lookalikes. ────── */
  button {
    font: inherit; cursor: pointer; border-radius: 12px; padding: 11px 16px;
    border: 1.5px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600;
  }
  button.btn-secondary { background: transparent; color: var(--ink); border-color: #c6d6bb; font-weight: 500; }
  .tick { margin-right: 7px; }
  textarea {
    width: 100%; font: inherit; padding: 10px; border: 1.5px solid #c6d6bb; border-radius: 12px;
    margin-top: 8px; resize: vertical;
  }
  /* `[paul-ruled 2026-09-06]` the general-feedback bubble: on every signed-in screen, pinned to the
     side, in the colour this page already wears. The same shape as the app's ribbon. */
  /* icon-only: a labelled pill of any length covered the ranked list's tail at the fold on every seat's
     walk (rounds 4–6); a 46px circle in the corner is the smallest footprint a persistent control can have */
  .fbbubble { position:fixed; right:12px; bottom:14px; z-index:900; display:inline-flex; align-items:center; justify-content:center;
              width:46px; height:46px; padding:0; background:var(--accent); color:#fff; border:0; border-radius:50%;
              box-shadow:0 2px 10px rgba(0,0,0,.25); font:inherit; font-size:1.25rem; text-decoration:none; cursor:pointer; }
  .fblink {
    background: none; border: 0; padding: 0; color: var(--ink-soft);
    text-decoration: underline; font-weight: 400; font-size: .95rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header><div class="inner">
  <!-- ⭐ THE UTILITY ROW, inside the masthead band and above the name `[ux-expert 2026-09-06]`.
       Costs ~22px at A+ and that is the whole price. NOT the masthead-as-control (it double-books
       §3b's standing job — the top bar always answers "where am I" — and a chevron on the place's
       name routes on decoration). NOT a hamburger or a gear: glyph-only routing is SaaS chrome, and
       this reader's measured depth is 1.
       ⛔ EACH CONTROL NAMES ITS DESTINATION IN WORDS. That is what dissolves the origin problem
       rather than solving it: place settings has exactly one parent (this page) and account
       settings has exactly one (the shelf), so "back" is a word and never a stored value that can
       be wrong. The constraint that keeps it true lives on the shelf — a row there does ONE thing,
       enter the home. -->
  <div class="utility">
    <a class="ubtn tap44" href="/homes/">‹ Your homes</a>
    <a class="ubtn tap44" href="/settings/place/">Settings</a>
  </div>
  <h1 id="place">My Home</h1>
  <p class="who" id="who" hidden></p>
</div></header>

<!-- ⭐ THE MECHANISM, NOT THE IMPORTANCE `[paul-ruled 2026-09-06]`. "Critical" asserts the value of
     her input, which transfers weight to a reader who has just answered six questions; this states
     how the thing works, which puts the work on Paul. It is also VERIFIABLE on the screen it sits
     on — at day one everything below genuinely is what she supplied. It promises no contact and no
     cadence, so it survives the reader who declined contact.
     ⚠️ It decays on STATE, never on a clock: it goes when the first card is built from her data.
     Never on visit count — someone may open this three times in week one before anything exists,
     and a counter would remove the one line explaining why the screen is bare. -->
<div class="banner" id="banner"><div class="inner"><p class="bannertext">Everything here gets built from what you tell me.</p></div></div>

<div class="wrap">

  <div class="card">
    <p class="state">Early days</p>
    <!-- ⚠️ id'd 2026-09-07 so the SAME BLOCK that writes #doorlede can correct this one. It is the
         pre-JS default and stays the conservative claim: correct for an unplaced household, and
         correct for anyone whose scripting never runs. -->
    <p class="lede" id="doorstate">Nothing's been built on it yet — that's my job.</p>

    <!-- B15 (lap 7, closure row 33) — the refusal state prints ABOVE the rows; the rows themselves stay -->
    <p class="soft" id="reachstate" hidden></p>
    <div class="rows" id="rows"></div>
    <!-- ⭐ THE DOOR. Until R4 (2026-09-06) `/viewer` on every origin was ONE HOUSEHOLD's build, so this page
         deliberately offered no way in. Each household origin now builds its own app from its own
         instance, and three seats reading their walks each reported reaching it only by typed URL.
         Copy is a placeholder for content-steward's line; the destination is not. -->
    <p class="door"><a class="ubtn tap44" id="openapp" href="/viewer">Open your place ›</a></p>
    <p class="quiet" id="doorlede"></p>
  </div>

  <!-- The general feedback channel, on this screen as on every other. `paul-stated 2026-09-05`:
       available once someone has an account and is signed in. Closed by default — a standing open
       textarea is the affordance-without-signal trap. -->
  <!-- compact: the long label covered the ranked list at 414 × A+ on every seat's walk (round 4) -->
  <p><button type="button" id="fbopen" class="fbbubble" aria-label="Something not right? Tell me.">💬</button></p>
  <div id="fbbox" hidden>
    <textarea id="fbnote" rows="3" placeholder="Anything at all"></textarea>
    <p><button type="button" id="fbsend"><span class="tick">✓</span>Send</button></p>
  </div>
  <p id="fbthanks" class="quiet" hidden></p>
</div>

<script>
(function () {
  "use strict";
  // ⛔ DERIVED, NOT ENUMERATED — and that is a tenancy decision, not a tidiness one. The obvious
  // shape here is the lookup map onboarding uses, whose KEYS spell out a household's name.
  // check-estate-neutral flagged those keys on this page's first run: a household's name, in the
  // bytes a brand-new reader is served, on the one surface whose whole job is to name no other
  // household. The tool's own message says fix the surface rather than allow-list the token, so:
  // the Pages host and its Worker share a label, and the label is read from the URL the reader is
  // already on. No household name is written here at all, and a new estate needs no edit.
  var label = (location.hostname.split(".")[0] || "");
  var WORKER = (/\.pages\.dev$/.test(location.hostname) && /^[a-z0-9-]{2,40}$/.test(label))
    ? "https://" + label + ".paul-kirschenbauer.workers.dev"
    : "https://fernwood.paul-kirschenbauer.workers.dev";

  // Same key names as onboarding — this page READS what that flow wrote and writes none of them.
  var K_GRANT = "fw-grant", K_ADDR = "fw-onboard-addr", K_PARTS = "fw-onboard-parts",
      K_NAME = "fw-onboard-name", K_COLOR = "fw-accent", K_OWNER = "fw-onboard-owner",
      K_USER = "fw-username", K_RANK = "fw-onboard-interests", K_JOURNAL = "fw-journal-name",
      K_PREF = "fw-onboard-contact",
      // W0 · the household's own coordinates, mirrored from the record so the viewer can paint
      // weather/sky/place from THIS place before first paint. Derived, never typed by anyone.
      K_COORDS = "fw-onboard-coords";
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function el(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s); }

  // ⭐ THE LINK CARRIES THE WAY IN, HERE TOO. s0 promises "a way back in — so this is yours on any
  // phone, not just this one", and until now only onboarding accepted `?g=`. So the promise held
  // for setup and broke at the arrival: a second device landing straight here had no credential,
  // no receipts, and no way to get either. Same handling as onboarding, deliberately — one
  // mechanism, not a second one that drifts.
  // ⛔ AND THE CREDENTIAL IS STRIPPED FROM THE URL IMMEDIATELY. A grant left in the address bar
  // survives in history, in a screenshot, and in whatever she taps "share" on — a credential that
  // outlives its one use in three places is a credential we handed out.
  (function takeGrantFromLink() {
    try {
      var u = new URL(location.href);
      var fromLink = u.searchParams.get("g");
      if (!fromLink) return;
      localStorage.setItem(K_GRANT, fromLink);
      u.searchParams.delete("g");
      history.replaceState(null, "", u.pathname + u.search + u.hash);
    } catch (e) {}
  })();
  var grant = read(K_GRANT);

  // ⛔ THE OWNER GUARD, CARRIED OVER DELIBERATELY. onboarding clears its stored answers when the
  // grant changes, because a shared device once resumed a different person's progress and showed
  // them an address they had never typed. This page reads those same answers, so it must honour the
  // same rule or it re-opens the hole one screen later: if the stored answers belong to another
  // credential, they are not shown.
  var owner = read(K_OWNER);
  var mine = !!grant && (!owner || owner === grant);

  // content-steward 2026-09-06 (drafted for Paul's read): the door's lede is anchored in the one thing we
  // know about them. Two variants, whole or nothing — never a template with a hole in it.
  // ⛔ THIS SENTENCE WAS TRUE UNTIL W0 AND IS NOW FALSE FOR A PLACED HOUSEHOLD. Measured 2026-09-07
  // by three seats: "Nothing's been built on it yet" / "Empty so far." sat one tap in front of an app
  // carrying a 7-day forecast, an hourly strip, a rainfall panel and eight dated sky events. It
  // undersells the product at the exact moment a person decides whether to go in.
  //   ⭐ AND THE HONEST LINE DEPENDS ON WHETHER THEY ARE PLACED, which is the whole point of W0: a
  //   household with coordinates already has weather and sky, derived from the address they gave and
  //   nothing else. A household we could not place — a box number — genuinely has nothing yet, and
  //   for them the original sentence is still exactly right.
  // Two variants, whole or nothing, never a template with a hole in it (the steward's rule above).
  try {
    // ⛔ THREE DEFECTS IN THIS ONE READ, all found 2026-09-07 by the strict seat reading the source.
    // 1 · OWNER GUARD. `:298` below does `mine ? read(K_NAME) : null` — this line did a BARE read.
    //     On a shared device, another person's leftover `fw-onboard-coords` tells a NEW, UNPLACED
    //     reader "Your place is set up." The guard is the file's own convention and I skipped it.
    // 2 · THE SAME PREDICATE THE APP USES. This tested `latitude != null`; the viewer requires
    //     `isFinite(lat) && isFinite(lon)` (viewer.html:7317/7331). A half-coordinate passed the
    //     door and failed the app ONE TAP LATER — the self-contradiction this block exists to
    //     remove, moved from inside a card to across a tap. Both halves, finite, or not placed.
    // ⚠️ 3 · STILL OPEN, and it is timing, not content: `placed` is read SYNCHRONOUSLY from
    //     localStorage while `fw-onboard-coords` arrives ASYNC from /api/grant/whoami, and the
    //     correction is a full location.reload() gated on `changed`. So a placed household on a
    //     SECOND device paints "Empty so far." first. Three exits never self-correct — no grant,
    //     non-2xx, and the network catch — and the catch's own comment ("the cached view stands,
    //     and says nothing false") INVERTS for an uncached device: on a first load there is no
    //     cached view, the default is an authored positive claim, and it is false. Not fixed here
    //     because the honest fix is to render this card from the reconcile rather than before it,
    //     which is a bigger change than tonight should carry.
    // ⭐ HOISTED 2026-09-08 so the ROWS renderer can agree with the header above it.
    placed = false;
    if (mine) {
      try {
        var c = JSON.parse(read(K_COORDS) || "null");
        // ⛔ `typeof === "number"`, NOT `isFinite(Number(x))`. Number(null) is 0 and isFinite(0) is
        // true, so the Number() form passed BOTH the half-coordinate this block names and a
        // {latitude:null, longitude:null} pair — the second a REGRESSION on the previous
        // `latitude != null` test, in the exact direction this block exists to prevent. Found
        // 2026-09-07 by the owner seat, reproduced in node. Neither shape is reachable today
        // (worker.js:3643 returns a bare null and :484 skips falsy values, so the key is never
        // written) — and that is the point: the predicate was being saved by a falsy check in
        // another file rather than by its own design, which is the same accidental safety that
        // masked the gauge leak (an allow-list) and the zones leak (deploy-time pruning).
        placed = !!(c && typeof c.latitude === "number" && isFinite(c.latitude)
                      && typeof c.longitude === "number" && isFinite(c.longitude));
      } catch (e) {}
    }
    // ⛔ BOTH SENTENCES OR NEITHER. Fixing only #doorlede made this card CONTRADICT ITSELF — measured
    // 2026-09-07 by the mom seat: "Nothing's been built on it yet" at the top and "Your weather and
    // sky are in there already" four inches below, on one card. That is the same defect this lap
    // spent the afternoon removing from the weather card, introduced by a partial fix to the copy
    // that was meant to remove it. A correction placed BELOW the sentence it corrects is not a
    // correction; it is a second claim.
    if (placed) {
      try { el("doorstate").textContent = "Your place is set up. Weather and sky are already in there."; } catch (e) {}
      el("doorlede").textContent = "The rest fills in as you add it.";
    } else {
      el("doorlede").textContent = "Empty so far.";
    }
  } catch (e) {}
  var name = mine ? read(K_NAME) : null;
  if (name) { el("place").textContent = name; document.title = name; }
  // The seventh and last person-scoped read on this card. A colour is lower stakes than a username
  // or a ranking — it is guarded anyway, because INCONSISTENT application of this guard is what
  // produced the defect: four of seven reads had it, and the three that did not were the ones that
  // leaked. A visitor who does not own the stored answers gets the default, which is correct.
  var hex = mine ? read(K_COLOR) : null;
  if (hex && /^#[0-9a-fA-F]{6}$/.test(hex)) document.documentElement.style.setProperty("--accent", hex);
  // ⛔ OWNER-GUARDED, 2026-09-07. This card had SEVEN person-scoped reads and the guard reached
  // FOUR. `fw-username` and `fw-onboard-interests` were bare — so on the shared device the guard
  // exists for, the card would omit one person's name and address while printing ANOTHER person's
  // username and their ranked priorities. Those are more identifying than the coordinates that
  // prompted the guard. Found by the wide-eyed seat reading three lines below my own fix.
  var user = mine ? read(K_USER) : null;
  if (user) { el("who").textContent = "Signed in as " + user; el("who").hidden = false; }

  // ── the rows ───────────────────────────────────────────────────────────────────────────────
  // ⭐ RECEIPTS, NOT QUESTIONS. Everything s4 already settled appears here with its settled state.
  // There is no second confirm pair: the address was confirmed beside a map pin one screen ago, and
  // asking again would be the same question thirty seconds later with a different vocabulary.
  // ⛔ A ROW WITH NOTHING IN IT IS OMITTED, never rendered as "(none chosen)". Silence beats a false
  // season, and an absent row and a row reading `nothing` are different messages.
  var rows = [];

  var addr = mine ? read(K_ADDR) : null;
  if (addr) {
    // ⛔ A MAIL DROP IS NOT A PLACE, AND SAYING SO IS THE KINDEST OPTION AVAILABLE
    // `[paul-ruled 2026-09-06]`. The `strict` seat gave a PO box, was promised the app would "build
    // your place around that address", and nothing ever pushed back — she tapped confirm "on a
    // technicality" knowing the promise rested on a fiction. Her words: everything was "recognized
    // as a string but not evaluated as content".
    // ⛔ AND NOT A VALIDATOR. ux-expert was explicit: a form that rejects her address scolds the one
    // reader least willing to be told she is wrong, on the screen where she has already disclosed
    // the least she could. So the app takes the answer, keeps it exactly, and says plainly what it
    // cannot do with it — the failure becomes visible and kind instead of silent and permanent.
    var boxy = /\b(p\.?\s?o\.?\s*box|post\s*office\s*box|postal\s*box)\b/i.test(addr);
    rows.push({
      label: "Where it is",
      value: addr,                       // exactly as typed: no case-correction, no standardising
      // A22 (lap 7, closure 41) — the PO-box sentence is said ONCE, at the gate; this row-level repeat
      // was a second telling (and the place card's own copy explains a blank weather card — a different
      // job, kept). The act stays: a box-only household still has a next move.
      prov: "",
      act: boxy ? "Add where it is ›" : "That's not right ›"
    });
  }

  // ── how to reach you ───────────────────────────────────────────────────────────────────────
  // Shown because it was answered once, pre-selected by default, and never surfaced again. "None"
  // is stated plainly rather than softened: it is the choice with the largest consequence, and a
  // reader who picked it should be able to see that it took.
  var pref = mine ? read(K_PREF) : null;
  if (pref) {
    rows.push({
      label: "How to reach you",
      value: pref === "none" ? "You asked me not to."
           : pref === "phone" ? "By phone." : "By email.",
      prov: pref === "none"
        ? "I'll keep to that. If you lose your password, email me."
        // ⛔ "you didn't pick one" reported the PRODUCT'S OWN PRE-SELECTION as the reader's omission
        // — three seats, three runs, 2026-09-07. The option was ticked before they arrived; not
        // changing a default is not a failure to answer, and telling someone they left something
        // undone when they did not is the small dishonesty that makes the honest lines harder to
        // believe. It still says the value is a default, which is the true and useful half.
        : (read("fw-onboard-contact-chosen") === "1" ? ""
                                                       : "The default \u2014 change it whenever you like."),
      act: "Change that ›"
    });
  }

  // ⭐ THE ONE GENUINELY DERIVED ROW. Everything else here is a receipt of what was recorded; this
  // is the record TRANSFORMED — her own ranking, read back as the order the work happens in. It is
  // what makes the page a receipt rather than a form, and it is derived from HER ranking rather
  // than a default order, so a condo with no garden does not get told plants come first.
  // ⚠️ WHAT IS NOT HERE AND WHY: research asked for a row like "Bangor, Maine — zone 5a, last frost
  // May 20." There is no geocoding path in this product — `hardiness` and `frostDates` come from
  // property.json, which is hand-authored canon for one place. Inventing a zone from a state name
  // would be a confidently-wrong number on the exact surface whose job is to be trusted. When an
  // address→coordinates→zone path exists, this row is where its output belongs.
  var ranked = null;
  // Owner-guarded with the rest — a ranking is a statement of what someone cares about most.
  try { ranked = mine ? JSON.parse(read(K_RANK) || "null") : null; } catch (e) { ranked = null; }
  // ⛔ AN EMPTY RANKING IS NOT A MISSING ONE. She looked at the list and chose nothing, which is a
  // real answer; the row is omitted rather than printing "(none chosen)" at her, because silence
  // beats telling someone their answer was empty. But the two states stay distinguishable in the
  // record, which is what the ranking handler's own comment insists on.
  if (mine && ranked && ranked.length) {
    rows.push({
      label: "What I'll build first",
      // ⛔ IT SHOWED ONLY THREE. `wide-eyed` ranked four and watched the fourth vanish with no
      // acknowledgment — "my 4th pick vanishes with no acknowledgment". Silently dropping part of
      // what someone told us, on the screen whose entire job is showing that we heard them, is the
      // worst place in the product to do it. Every pick shows.
      // ⭐ And the "an idea — not built yet" marker travels with it: the same seat noted an unbuilt
      // idea was listed "with the same confidence as the two real features", so a caveat she was
      // shown while choosing had quietly disappeared by the time we repeated it back.
      value: ranked.map(function (r, i) {
        var label = (r && r.label) || r;                 // older runs stored a bare string
        var soon = !!(r && r.soon);
        return (i + 1) + ". " + label + (soon ? "  (an idea — not built yet)" : "");
      }).join("\n"),
      act: "Change the order ›"
    });
  }

  var fetching = false;
  // whether this household has coordinates — read by BOTH the door copy and the rows empty state
  var placed = false;
  // ⭐ D3 — the record's answer, as a STATE: "ok" we heard · "unknown" we could not ask (the fetch
  // threw, or a transient non-2xx) · "refused" it answered and does not know this credential (404) ·
  // "broken" it answered 5xx. Was one boolean, `reachUnknown`, which rendered a refusal as an outage.
  var reach = "ok";

  function render() {
    var host = el("rows");
    host.innerHTML = "";
    rows.forEach(function (r) {
      var d = document.createElement("div"); d.className = "row";
      var l = document.createElement("p"); l.className = "label"; l.textContent = r.label;
      var v = document.createElement("p"); v.className = "value"; v.textContent = esc(r.value);
      d.appendChild(l); d.appendChild(v);
      if (r.prov) { var p = document.createElement("p"); p.className = "prov"; p.textContent = r.prov; d.appendChild(p); }
      if (r.act) {
        // ⛔ THE EDIT ROUTE IS A NOTE, NOT A TRIP BACK THROUGH THE FLOW — F12. Re-entering
        // onboarding's step()/K_STEP walks the reader forward through the confirm and the ranking
        // again, so a "fix one thing" control would re-ask everything after it. Until that is
        // fixed, correcting a value tells Paul what it should say; the loop closes on his side.
        var a = document.createElement("p"); a.className = "act";
        var link = document.createElement("a"); link.href = "#"; link.textContent = r.act;
        link.addEventListener("click", function (e) { e.preventDefault(); openFb(r.label); });
        a.appendChild(link); d.appendChild(a);
      }
      host.appendChild(d);
    });
    if (!rows.length) {
      // Honest, and not a skeleton: no greyed tiles, no spinner. The absence of rows IS the picture.
      var p = document.createElement("p"); p.className = "soft";
      // ⛔ THREE EMPTY STATES, NOT ONE. This single line told a returning reader on a fresh device
      // that she had never set her place up — which is false, and it is the reader most likely to
      // see it. Now it distinguishes: no credential at all · a credential whose record is still
      // being fetched · a credential whose record genuinely holds nothing yet.
      // ⭐ B1, 2026-09-08 — this surface already had THREE states and was the model the other two
      // copied from. It was still missing the fourth: a credential the record REFUSED. That reads
      // "Nothing here yet", which is the same lie /homes/ told Paul, one screen over.
      p.textContent = !grant
        ? "Open your invitation link and your place will be here."
        : (fetching ? "Fetching your place…"
      // ⭐ D3 (lap 7 row D) — THREE STATES, NOT ONE. A response that ARRIVED and said no (404 — the
      // credential is not known here; durable; the remedy is a person or the door, and it must never
      // suggest retrying) · a fetch that THREW (no network — transient; the remedy is location, and it
      // must never suggest the credential is bad) · a response that arrived BROKEN (5xx — Paul's).
      // On this property "we couldn't reach your place" is frequently TRUE, which made it the most
      // believable possible cover for a refusal. SECURITY L2's falsifier: an unknown grant with the
      // network up and a known grant with it down must render DIFFERENT screens.
      // 429 and anything else non-2xx stays "unknown": transient, retry-shaped, not a verdict.
                    // ⚠️ DRAFT SLOTS — content-steward's, human-confirmed before they reach a person.
                    : (reach === "unknown" ? "We couldn’t reach your place just now — nothing is lost."
                    : reach === "refused" ? "This sign-in isn’t working here. Sign in again and your place will be back — nothing on it has gone anywhere."
                    : reach === "broken"  ? "Something’s wrong on my side, not yours — nothing is lost."
                                    // ⛔⛔ THE THIRD STRING. On 2026-09-07 this card was fixed so
                                    // `#doorstate` and `#doorlede` could not contradict each other —
                                    // "both sentences or neither", in that fix's own words. THIS one
                                    // lives in a different function and kept saying the opposite:
                                    // Paul walked it 2026-09-08 and read "Your place is set up.
                                    // Weather and sky are already in there" above "Nothing here yet",
                                    // and called the journey contradictory. Fixing two of three
                                    // strings left the defect where it was — the class fix applied
                                    // to the instance, again.
                                    // ⭐ A PLACED household HAS something: its weather and its sky.
                                    // What it has none of is anything the PERSON put there, and that
                                    // is a different sentence. ⚠️ Wording is content-steward's (B9);
                                    // this removes a contradiction rather than settling the voice.
                                    : (placed ? "Nothing you’ve added yet."
                                              : "Nothing here yet.")));
      host.appendChild(p);
    }
  }
  render();

  // ── the server is the truth; localStorage is a cache ───────────────────────────────────────
  // ⛔ THIS PAGE READ ONLY localStorage AND NEVER THE SERVER. So it was blank on a second device —
  // falsifying s0's "yours on any phone, not just this one" — and the run-authority mechanism could
  // name a winning run that nothing rendered, because the page never asked anyone.
  // ⭐ RENDER LOCAL INSTANTLY, THEN RECONCILE. Her place appears with no spinner and no wait, and
  // the record corrects it a moment later if they differ.
  // ⛔ AND THE SERVER WINS, NOT THE NEWER ONE. Resolving by timestamp is the trap: the aborted
  // attempt is usually the LAST one, and device clocks skew. Silence on a transport failure — an
  // offline reader keeps the cached view rather than being told her place is empty, which matters
  // here because the property has no cell reception and Wi-Fi only near the house.
  (function reconcile() {
    if (!grant) return;
    if (!rows.length) { fetching = true; render(); }
    fetch(WORKER + "/api/grant/whoami", { headers: { "X-Grant": grant } })
      .then(function (r) {
        if (r.ok) return r.json();
        reach = r.status >= 500 ? "broken" : (r.status === 404 || r.status === 401 || r.status === 403) ? "refused" : "unknown";
        return null;
      })
      .then(function (d) {
        // ⛔ EVERY EXIT CLEARS THE SPINNER `[F4, 2026-09-07]`. `fetching` was set at :485 and NEVER
        // set back — the only exit was `location.reload()`, which fires only when something changed.
        // So a reconcile that succeeded and agreed, a non-2xx, and an offline throw ALL left
        // "Fetching your place…" on screen forever. Three different truths, one dead screen.
        // a non-2xx says nothing about her place — and now the screen says that rather than
        // presenting silence as an inventory
        if (!d) { fetching = false; if (reach === "ok") reach = "unknown"; render(); quarantine(); return; }
        reach = "ok";
        var changed = false;
        function put(k, v) {
          if (v == null || v === "") return;
          try { if (localStorage.getItem(k) !== String(v)) { localStorage.setItem(k, String(v)); changed = true; } } catch (e) {}
        }
        put(K_NAME, d.name);
        put(K_COLOR, d.accent);
        put(K_ADDR, d.address);
        put(K_PREF, d.contactPref);
        if (d.addressParts) put(K_PARTS, JSON.stringify(d.addressParts));
        if (d.ranked) put(K_RANK, JSON.stringify(d.ranked));
        // W0 · coordinates come from the RECORD only — nothing here ever computes or defaults them.
        // A household the Worker could not place has `coordinates: null` and stays S0; `put` ignores
        // null, so a provider outage leaves a previously-placed household placed.
        if (d.coordinates) put(K_COORDS, JSON.stringify(d.coordinates));
        // ⭐⭐ THE STAMP THE RECONCILE NEVER WROTE — this is F4, and it is the whole regression.
        // Every row on this card is gated on `mine` (:269), which compares the stored owner stamp
        // against the presented grant. The reconcile wrote the server's answer into six keys and
        // left the SEVENTH — the stamp that says whose answer it is — untouched. So on any device
        // whose stamp names a PREVIOUS grant, this page fetched the correct record, stored it, and
        // then suppressed every row of it. Measured live on 2026-09-07: whoami returned
        // `name: "Grant Park Condo"` with an address and a ranking while the screen read
        // "Empty so far."
        // ⭐ WHY STAMPING HERE IS CORRECT AND NOT A PAPER-OVER: `/api/grant/whoami` was just
        // answered 200 FOR THIS GRANT, and the six puts above have just overwritten local state with
        // that grant's record. The data and the stamp now describe the same person; leaving the old
        // stamp is what made them disagree. The guard is kept — it is `owner === grant` that protects
        // a shared device — and this only ever advances the stamp to the credential the SERVER just
        // confirmed, never to one the page merely found lying around.
        // ⚠️ If the record comes back blank, this stamps a blank record as genuinely this person's,
        // and the card honestly renders an empty place UNDER THE RIGHT NAME. That is the intended
        // outcome: today it renders an empty place under SOMEONE ELSE'S name, which is worse.
        put(K_OWNER, grant);
        // ⭐ E1 — the display name rides the same reconcile as every other fact, so a household that
        // renamed its Almanac on one device sees that name on the next. `put` ignores null, so a
        // record without one leaves the local value alone.
        put(K_JOURNAL, d.journalName);
        // Re-render only if the record actually disagreed, so the common case costs nothing and a
        // reader never sees her own screen flicker for no reason.
        if (changed) { location.reload(); return; }
        fetching = false; render();           // agreed with the record — stop pretending to fetch
      })["catch"](function () {
        // offline: the cached view stands, and says nothing false — but it must stop saying "fetching"
        // ⛔ AND IT MUST NOT FALL BACK TO "Nothing here yet", which is a claim about her place made
        // by a request that never arrived. A rejection and a refusal are the same claim: we did not
        // learn anything.
        fetching = false; reach = "unknown"; render(); quarantine();
      });
  })();

  // ⭐ B15 (lap 7, closure row 33) — QUARANTINE ON A REFUSED CREDENTIAL. Keep the cached rows; drop
  // "Signed in as <user>" (a claim the record just declined); turn the open control into the door;
  // print the refusal state above the list. ⛔ NEVER clear storage on a refusal — the no-signal
  // premise makes clear-on-failure destructive. A refusal changes what the page CLAIMS; only the
  // person changes what the device KEEPS. Sentence is a DRAFT slot, content-steward's.
  function quarantine() {
    try {
      var st = el("reachstate");
      if (reach !== "refused") { if (st) st.hidden = true; return; }
      el("who").hidden = true;
      var open = el("openapp");
      if (open) { open.textContent = "Sign in \u203a"; open.href = "/onboarding/"; }
      if (st) { st.textContent = "This sign-in isn\u2019t working here. What\u2019s below is what this phone remembers \u2014 sign in again to see the record."; st.hidden = false; }
    } catch (e) {}
  }

  // ── telemetry: `complete` lives HERE now ───────────────────────────────────────────────────
  // ⛔ IT USED TO FIRE ON THE HANDOFF TAP, 120ms before navigation began, with the detail
  // "reached-estate" — so it recorded a TAP as an outcome. The record could not tell "walked into
  // her place" from "closed the tab", which is precisely the pair the journey exists to separate.
  // This page is the only thing that can honestly say she arrived, because it only runs if she did.
  // ⛔ NO VALUES, EVER — names of things touched, never a character typed. The Worker re-enforces
  // an allow-list (screen · field · … · handoff · complete · session); an unrecognised name is
  // dropped silently, so nothing new is invented here.
  var SID = (function () { try { return Math.random().toString(36).slice(2, 12); } catch (e) { return "x"; } })();
  var arrivedAt = Date.now();
  function send(events, useBeacon) {
    if (!events.length || !WORKER) return;
    var body = JSON.stringify({ sid: SID, events: events });
    try {
      // text/plain, not application/json — a JSON body makes the request non-simple, which needs a
      // CORS preflight, and sendBeacon cannot preflight, so the browser drops it silently. The
      // Worker parses the body regardless of type. That defect already cost this project the
      // handoff event once.
      if (useBeacon && navigator.sendBeacon) {
        navigator.sendBeacon(WORKER + "/api/onboarding-metrics",
                             new Blob([body], { type: "text/plain;charset=UTF-8" }));
        return;
      }
      fetch(WORKER + "/api/onboarding-metrics",
            { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" },
              body: body, keepalive: true })["catch"](function () {});
    } catch (e) { /* instrumentation must never cost her the page */ }
  }
  send([{ name: "screen", screen: "arrival", detail: "enter", n: null, msIn: 0,
          at: new Date().toISOString() },
        { name: "complete", screen: "arrival", detail: "reached-estate", n: rows.length, msIn: 0,
          at: new Date().toISOString() }], false);
  // ⭐ DWELL IS THE PRE-REGISTERED TEST, not a number collected in case. user-researcher's
  // prediction, recorded before the data exists: if the playback is doing its job, dwell here
  // exceeds the median setup-screen dwell; if it reads as a form to skim, it lands under a few
  // seconds. Both outcomes are readable, which is what makes it a test.
  window.addEventListener("pagehide", function () {
    send([{ name: "screen", screen: "arrival", detail: "left", n: null,
            msIn: Date.now() - arrivedAt, at: new Date().toISOString() }], true);
  });

  // ── the feedback channel ───────────────────────────────────────────────────────────────────
  var pendingAbout = null;
  function openFb(about) {
    pendingAbout = about || null;
    el("fbbox").hidden = false;
    el("fbnote").placeholder = about ? "What should it say instead?" : "Anything at all";
    el("fbnote").focus();
  }
  el("fbopen").addEventListener("click", function () { openFb(null); });
  var fromSurface = null;
  try {
    var _q = new URL(location.href).searchParams;
    fromSurface = /^[a-z-]{2,30}$/.test(_q.get("from") || "") ? _q.get("from") : null;
    if (_q.get("fb") === "1") openFb(null);
  } catch (e) {}

  el("fbsend").addEventListener("click", function () {
    var note = (el("fbnote").value || "").trim();
    // ⛔ AN EMPTY SEND DOES NOTHING. A receipt for something that never left the browser is worse
    // than no receipt, because she stops watching for the real one.
    if (!note) { el("fbnote").focus(); return; }
    var body = {
      id: "estate-" + (pendingAbout ? pendingAbout.toLowerCase().replace(/[^a-z]+/g, "-") : "general"),
      answer: note,
      // ⭐ ONE SHAPE FOR GENERAL FEEDBACK `[paul-ruled 2026-09-06]`: labelled, with the surface and screen.
      // `from` names the page a bubble on a page with no box of its own sent the reader here from.
      context: { type: "general-feedback", surface: fromSurface || "estate", screen: "arrival", about: pendingAbout || null }
    };
    var h = { "Content-Type": "application/json" };
    if (grant) h["X-Grant"] = grant;
    fetch(WORKER + "/api/feedback", { method: "POST", headers: h, body: JSON.stringify(body) })
      .then(function (r) { done(r && r.ok); })["catch"](function () { done(false); });

    // ⛔ THIS TOLD HER HER NOTE WAS SAFE AND THREW IT AWAY. The textarea was cleared BEFORE the
    // success branch, and on any non-2xx the message read "Saved on this device. I'll pick it up
    // next time you're online" — while nothing wrote to localStorage and nothing retried. The note
    // was gone. The comment above it said "only a real 2xx may say it landed", directly over the
    // code that lied.
    // ⛔ THAT IS THE ONE RULE THESE SURFACES CANNOT BREAK: capture must not lie. A receipt for
    // something that never left the browser is worse than no receipt, because she stops watching
    // for the real one — and this project has already paid for exactly that once.
    // ⭐ So: her words are not cleared until the server has them, and a failure says what is true
    // and leaves the note where she can send it again — the same shape onboarding already uses
    // ("Your answers are still here — tap once more") rather than a second vocabulary for it.
    function done(ok) {
      var t = el("fbthanks");
      if (ok) {
        el("fbbox").hidden = true;
        el("fbnote").value = "";           // cleared ONLY once it is somebody else's problem
        t.textContent = "Got it.";
      } else {
        el("fbbox").hidden = false;        // stays open, with her words still in it
        t.textContent = "That didn't go through — your note is still here, tap Send once more.";
      }
      t.hidden = false;
    }
  });
})();
</script>
</body>
</html>
